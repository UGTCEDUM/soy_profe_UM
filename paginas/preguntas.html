<body>
<div class="wrap">
  <h1>Preguntas frecuentes</h1>
  <p class="intro">Respuestas sobre los compromisos académicos de la Universidad de Manizales: qué son, cómo se leen, cómo se concertan y cómo se reconoce cada actividad. Toca una pregunta para ver la respuesta o busca por palabra clave.</p>

  <div class="controls">
    <div class="row">
      <div class="search">
        <label for="q" style="position:absolute;left:-9999px">Buscar en las preguntas</label>
        <input id="q" type="search" placeholder="Busca, por ejemplo: bonificación, asincrónica, tesis" autocomplete="off">
      </div>
      <button class="tool" id="toggleAll">Abrir todas</button>
    </div>
    <nav class="chips" id="chips" aria-label="Secciones"></nav>
  </div>

  <p class="status" id="status" aria-live="polite"></p>

</div>

<script>
const tbl=(h,r)=>`<div class="tbl"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${r.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const ul=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join("")}</ul>`;

const S=[
{id:"s1",t:"Los compromisos académicos",c:"--c1",b:"🧭",bn:"Brújula",q:[
 ["¿Qué son los compromisos académicos?",`<p>Es la herramienta con la que la Universidad y sus profesores planean, organizan y reconocen las actividades y responsabilidades de la labor profesoral durante un periodo académico. Hace visible cómo participa cada profesor en docencia, investigación, proyección social y gestión académica.</p><p>El Estatuto de los Académicos (2024) incluye los compromisos académicos entre los aspectos que regula (artículo 5) y señala que la jornada de trabajo se organiza con base en ellos (artículo 11, parágrafo 2).</p>`],
 ["¿Los compromisos académicos son lo mismo que el horario de clases del profesor?",`<p>No. Son una planeación de toda la labor del periodo, no solo un horario. Reconocen también el tiempo de actividades que muchas veces no se ven, como preparar, evaluar, asesorar, investigar y participar en la vida académica.</p>`],
 ["¿Es un registro de horas trabajadas?",`<p>No. Es la forma en que la Universidad reconoce y reserva el tiempo del profesor para cada una de sus funciones durante el periodo. Tampoco es una simple sumatoria de horas: es un acuerdo que articula las responsabilidades del profesor con las necesidades del programa y la facultad.</p>`],
 ["¿Por qué se construye un compromiso nuevo cada periodo?",`<p>Porque la vida académica cambia de un periodo a otro: las asignaturas ofertadas, los grupos, el número de estudiantes, los trabajos de grado, los proyectos y las necesidades de cada programa. El compromiso recoge esa realidad de forma coherente con los planes de estudio de los programas.</p>`],
 ["¿El compromiso se le asigna al profesor o se concerta?",`<p>Se concerta. El Estatuto reconoce el derecho del profesor a participar en la concertación de sus compromisos (artículo 33, literal d) y su responsabilidad de desarrollar las labores concertadas (artículo 34, literal b). Los interlocutores naturales de esa conversación son la dirección de programa o la decanatura.</p>`],
 ["¿Quiénes participan en la construcción del compromiso?",`<p>Se construye en corresponsabilidad. La dirección de programa o la decanatura concertan las actividades. Las direcciones de Docencia, Investigaciones y Posgrados y Proyección Social, el Instituto Pedagógico y el Cedum orientan y acompañan en su ámbito. Cada profesor aporta su conocimiento de lo que hace, su planeación y sus evidencias.</p>`],
 ["¿Cuáles son las cuatro dimensiones de la labor profesoral?",ul(["<strong>Docencia:</strong> acciones pedagógicas y didácticas que fortalecen los procesos formativos.","<strong>Investigación:</strong> actividades científicas, tecnológicas, de innovación y de investigación-creación.","<strong>Proyección social:</strong> acciones con el sector externo orientadas al desarrollo humano, social, económico, cultural y político.","<strong>Gestión académica:</strong> procesos de calidad, autoevaluación, representación, coordinación o dirección que crean las condiciones para las demás."])+`<p>No son compartimentos separados: un mismo profesor puede articularlas en su labor del periodo.</p>`]
],ch:[
 ["Según el Estatuto, ¿con base en qué se organiza la jornada de trabajo del profesor?",["En el horario de la sede","En los compromisos académicos","En la evaluación docente","En el número de estudiantes"],1,"El artículo 11, parágrafo 2, señala que la jornada se organiza con base en los compromisos académicos."],
 ["¿Cómo se define el compromiso de un profesor?",["Se le asigna sin consulta","Lo define él solo","Se concerta con la dirección de programa o la decanatura","Lo define Talento Humano"],2,"Se concerta: es un derecho del profesor (art. 33, literal d)."],
 ["¿Cuál de estas afirmaciones es correcta?",["El compromiso es el horario de clases","El compromiso es una sumatoria de horas","El compromiso planea toda la labor del periodo, incluidas actividades que no se ven","El compromiso se repite igual cada año"],2,"Reconoce también preparar, evaluar, asesorar, investigar y participar."]
]},
{id:"s2",t:"Dedicación y tipos de tiempo",c:"--c2",b:"⏱️",bn:"Reloj",q:[
 ["¿Cuántas horas deben organizarse en los compromisos de un profesor?",`<p>Depende del tipo de vinculación (artículo 14 del Estatuto):</p>${tbl(["Vinculación","Horas semanales","Contacto directo"],[["Tiempo completo","40","18"],["Medio tiempo","20","12"],["Cátedra","Entre 6 y 16","Según los procesos misionales asignados"]])}<p>El tiempo restante se dedica a preparación de clases, asesorías, acompañamiento a estudiantes, capacitación, evaluación de proyectos, autoevaluación y gestión curricular.</p>`],
 ["¿Qué es el contacto directo?",`<p>Es el tiempo de interacción o acompañamiento directo del profesor en cualquiera de las funciones misionales. No es solo la clase: también puede ser la asesoría de un trabajo de grado de posgrado o la coordinación de una línea de investigación, cuando así lo establecen las orientaciones.</p>`],
 ["¿Qué es el contacto indirecto-complementario?",`<p>Es el tiempo dedicado a la gestión académica y curricular y a otras actividades que aportan a las funciones misionales y completan la dedicación del profesor. Ambos tiempos son igualmente valiosos: la diferencia está en la naturaleza de la actividad, no en su importancia.</p>`],
 ["¿Qué significa la sigla HCD?",`<p><strong>HCD</strong> son las horas semanales de contacto directo; por ejemplo, la clase con un grupo o la asesoría de una tesis doctoral.</p>`],
 ["¿Qué significa la sigla HCC?",`<p><strong>HCC</strong> son las horas semanales complementarias al contacto; por ejemplo, la planeación y preparación de clase, la evaluación y seguimiento o la formación docente.</p>`],
 ["¿Cómo se convierten las horas semestrales en horas semanales?",`<p>Se dividen entre 16, que son las semanas del periodo académico. Por ejemplo, 32 horas semestrales de formación docente equivalen a 2 horas semanales (HCC).</p>`],
 ["¿Qué son las horas de bonificación?",`<p>Son una forma de reconocimiento de actividades específicas que se registra por fuera de las horas de dedicación contractual. Hacen visible esa contribución, pero no forman parte de la dedicación. Son reconocimientos ocasionales según las necesidades que surjan en el periodo.</p>`],
 ["¿Cómo se suman dedicación y bonificación?",`<p>El total es la suma de ambas. Por ejemplo, un profesor de tiempo completo con 40 horas de dedicación y 6 de bonificación verá un total de 46 horas semanales.</p>`]
],ch:[
 ["¿Cuántas horas semanales de contacto directo tiene un profesor de tiempo completo?",["12","16","18","40"],2,"Tiempo completo: 40 horas semanales, de las cuales 18 son de contacto directo."],
 ["¿A cuántas horas semanales equivalen 32 horas semestrales?",["1","2","4","16"],1,"Se divide entre 16 semanas: 32 ÷ 16 = 2 horas semanales."],
 ["Un profesor de tiempo completo tiene 6 horas de bonificación. ¿Qué verá en el reporte?",["Dedicación de 46 horas","Total de 46 horas, con dedicación de 40","Total de 40 horas","Dedicación de 34 horas"],1,"La bonificación no forma parte de la dedicación: 40 + 6 = 46 horas en total."]
]},
{id:"s3",t:"Cómo leer el reporte",c:"--c3",b:"🔎",bn:"Lupa",q:[
 ["¿Cómo está organizado el reporte?",`<p>Va de lo general a lo particular: identificación y dedicación del profesor, distribución del tiempo entre los procesos misionales, actividades específicas de cada proceso y, al final, el plan de mejora y mantenimiento derivado de la evaluación docente.</p>`],
 ["¿Qué información aparece en el encabezado?",`<p>El nombre del profesor, el periodo (por ejemplo, 2026-2), el tipo de contrato, la dedicación y la categoría en el escalafón (Instructor Asistente, Instructor Asociado, Profesor Asistente, Profesor Asociado o Profesor Titular). Cuando aplica, también muestra la clasificación como investigador ante Minciencias.</p>`],
 ["¿Qué significan los cuatro indicadores generales?",ul(["<strong>Dedicación:</strong> tiempo semanal reconocido; debe coincidir con la vinculación (40, 20 o entre 6 y 16 horas).","<strong>Bonificación:</strong> tiempo de actividades reconocidas por fuera de la dedicación.","<strong>Total:</strong> suma de las dos anteriores.","<strong>Horas no aprobadas:</strong> tiempo de actividades registradas que aún no cuentan con aprobación."])],
 ["¿Qué muestran las barras de distribución?",`<p>El porcentaje y las horas semanales que se dedican a cada proceso misional, una barra para la dedicación y otra para la bonificación. Por ejemplo, 25 horas de docencia en un tiempo completo aparecen como 62,50 %, porque 25 es el 62,5 % de 40.</p>`],
 ["¿Para qué sirve el resumen gráfico del periodo?",`<p>Muestra cuándo ocurre cada actividad, con sus fechas de inicio y cierre. Ayuda a anticipar semanas con mayor carga, como encuentros concentrados de posgrado que coinciden con clases regulares o momentos de mayor evaluación.</p>`],
 ["¿Qué significan las siglas del reporte?",tbl(["Sigla","Significado"],[["HCD","Horas semanales de contacto directo"],["HCC","Horas semanales complementarias al contacto"],["SEM","Semestre del plan de estudios"],["CRE","Créditos"],["CD","Contacto directo"],["TI","Trabajo independiente"],["MOD","Modalidad"]])],
 ["¿Cómo se verifica que el compromiso cumpla con el Estatuto?",`<p>La plataforma compara el compromiso con los parámetros del Estatuto: la dedicación frente al tiempo vinculado (por ejemplo, 40 de 40 horas) y las horas de contacto directo frente a las previstas (por ejemplo, 18 de 18 en tiempo completo).</p>`],
 ["¿Cómo recibe y acepta el profesor su compromiso?",`<p>Una vez concertado, se envía por correo institucional. La plataforma registra el envío, las consultas y la aceptación. Aceptar significa reconocer en el compromiso las actividades concertadas para el periodo.</p>`],
 ["¿Qué debe hacer el profesor si algo no corresponde con lo acordado?",`<p>El profesor debe revisarlo con calma antes de aceptarlo y conversar la diferencia con la dirección del programa.</p>`],
 ["¿El compromiso puede cambiar durante el periodo?",`<p>Sí. Puede ajustarse por las dinámicas del programa; por ejemplo, un grupo que no se abre por falta de estudiantes o estudiantes de posgrado que no se matriculan. El ajuste se concerta entre el profesor y la dirección de programa o la decanatura.</p>`],
 ["¿Qué significa la etiqueta “Sujeta a estudiantes matriculados”?",`<p>Que el reconocimiento de esa actividad depende de que los estudiantes estén efectivamente matriculados. Es frecuente en la asesoría de trabajos de grado y tesis de posgrado: si el estudiante no se matricula, esas horas no se reconocen.</p>`]
],ch:[
 ["En un tiempo completo, ¿cómo aparecen 25 horas semanales de docencia en la barra de distribución?",["25 %","40 %","62,50 %","75 %"],2,"25 es el 62,5 % de 40 horas."],
 ["¿Qué indica la etiqueta “Sujeta a estudiantes matriculados”?",["Que la actividad es opcional","Que las horas solo se reconocen si los estudiantes se matriculan","Que el curso es virtual","Que la actividad ya fue aprobada"],1,"Si el estudiante no se matricula, esas horas no se reconocen."],
 ["Un profesor nota que una actividad no corresponde con lo acordado. ¿Qué debe hacer?",["Aceptar y esperar el siguiente periodo","Modificar el reporte por su cuenta","Revisarlo con calma y conversar la diferencia con la dirección del programa antes de aceptar","Ignorar el correo"],2,"Aceptar significa reconocer lo concertado; las diferencias se conversan antes."]
]},
{id:"s4",t:"Evaluación docente y plan de mejora",c:"--c4",b:"⚖️",bn:"Balanza",q:[
 ["¿Por qué aparece la evaluación docente en el compromiso?",`<p>Porque compromiso y evaluación forman un mismo ciclo: planear, desarrollar, evidenciar y mejorar. El reporte permite consultar la evaluación docente del periodo inmediatamente anterior.</p>`],
 ["¿Cómo se compone la evaluación docente?",`<p>Integra tres miradas, de las que resulta un promedio final:</p>${tbl(["Fuente","Peso"],[["Estudiantes","50 %"],["Jefe inmediato","25 %"],["Autoevaluación","25 %"]])}<p>La plataforma muestra además los resultados de los estudiantes en las dimensiones del ser, el saber y el hacer, y el detalle por asignatura y grupo.</p>`],
 ["¿Qué es la lectura cualitativa de la evaluación?",`<p>Es una síntesis construida a partir de los comentarios abiertos de los estudiantes: lo que valoran, lo que cuestionan, el tono general y lo que piden mejorar. Complementa los resultados numéricos, no los reemplaza. La plataforma advierte cuando hay pocas respuestas para interpretar con prudencia. Este apartado está en revisión con Tecnologías de la Información.</p>`],
 ["¿Qué enfoque tiene la evaluación?",`<p>El Estatuto la concibe como sistemática, diferencial, dimensional y, sobre todo, formativa (artículo 28). Busca reconocer fortalezas, identificar oportunidades de mejora y orientar el acompañamiento. El profesor tiene derecho a conocer oportunamente sus resultados y a recibir acompañamiento.</p>`],
 ["¿Qué es el plan de mejora y mantenimiento?",`<p>Es el plan que cada profesor formula a partir de su evaluación. Registra el resultado actual y el esperado por fuente y, para las dimensiones del saber, el hacer y el ser, define un objetivo, acciones concretas y una evidencia o indicador; por ejemplo, un syllabus actualizado o un horario de asesoría publicado.</p>`],
 ["¿Cuál es la diferencia entre mantenimiento y mejora?",`<p>El plan de mantenimiento busca consolidar una fortaleza. El plan de mejora busca fortalecer un aspecto de la práctica. Se indica en las observaciones del plan.</p>`],
 ["¿Quién construye y acompaña el plan?",`<p>Lo construye cada profesor y el jefe inmediato lo retroalimenta y acompaña su seguimiento (artículo 28, parágrafo 3). La Dirección de Docencia y el Instituto Pedagógico ofrecen apoyo según las necesidades identificadas.</p>`],
 ["¿Cómo se hace seguimiento al plan?",`<p>El plan incluye una fecha de presentación del avance y un espacio para registrar logros, evidencias y porcentaje de cumplimiento.</p>`],
 ["¿Puede el profesor usar las sugerencias de redacción de la plataforma?",`<p>Sí, como apoyo. Siempre deben ser revisadas y ajustadas por cada profesor.</p>`]
],ch:[
 ["¿Qué peso tiene la evaluación de los estudiantes en el promedio final?",["25 %","33 %","50 %","75 %"],2,"Estudiantes 50 %, jefe inmediato 25 % y autoevaluación 25 %."],
 ["¿Qué busca un plan de mantenimiento?",["Corregir un error grave","Consolidar una fortaleza","Sancionar al profesor","Reemplazar la evaluación"],1,"El mantenimiento consolida una fortaleza; la mejora fortalece un aspecto de la práctica."],
 ["¿Quién construye el plan de mejora y mantenimiento?",["El jefe inmediato","Los estudiantes","Cada profesor, con retroalimentación del jefe inmediato","La Dirección de Docencia"],2,"Lo construye el profesor y el jefe inmediato lo retroalimenta y acompaña (art. 28, par. 3)."]
]},
{id:"s5",t:"Docencia: presencialidad y virtualidad",c:"--c5",b:"📚",bn:"Libro",q:[
 ["¿Qué es un crédito académico?",`<p>Es la unidad que mide el trabajo académico del estudiante y equivale a 48 horas. Incluye las horas con acompañamiento directo del profesor y las de trabajo independiente (Decreto 1330 de 2019; Acuerdo 01 de 2009).</p>`],
 ["¿Qué relaciones existen entre acompañamiento directo y trabajo independiente?",tbl(["Programas","Relación","Horas por crédito"],[["Pregrados presenciales","1 a 2","16 de acompañamiento directo y 32 de trabajo independiente"],["Pregrados presenciales","2 a 1","32 de acompañamiento directo y 16 de trabajo independiente"],["Pregrados virtuales y posgrados","1 a 3","12 de acompañamiento directo y 36 de trabajo independiente"],["Pregrados virtuales y posgrados","3 a 1","36 de acompañamiento directo y 12 de trabajo independiente"]])+`<p>Existen otras relaciones según la naturaleza de las asignaturas. La referencia siempre es el plan de estudios aprobado del programa.</p>`],
 ["¿Cómo calcula el sistema las horas de docencia del profesor?",`<p>Toma del plan de estudios los créditos, su relación, la naturaleza del curso (teórico, teórico-práctico o práctico) y su modalidad. Con ellos calcula automáticamente las horas de contacto directo y las de preparación, seguimiento y evaluación.</p>`],
 ["¿La responsabilidad del profesor termina al salir de clase?",`<p>No. Abarca la totalidad de las horas del crédito. En el trabajo independiente el profesor no interviene en tiempo real, pero es quien lo diseña, orienta, acompaña y evalúa. El Estatuto incluye este acompañamiento entre los deberes de los académicos, con excepción de los catedráticos según la naturaleza de sus compromisos (artículo 34, literal f).</p>`],
 ["¿Qué papel cumple el syllabus?",`<p>En él se articulan el contacto directo y el trabajo independiente: qué se trabajará en los encuentros, qué hará el estudiante de forma autónoma, con qué propósito y recursos, y cómo se hará seguimiento y evaluación. La planeación de clase debe quedar consignada allí.</p>`],

 ["¿Qué cuenta como contacto directo en la modalidad virtual?",`<p>Tanto las horas sincrónicas como las asincrónicas de interacción en plataforma, que en la virtualidad se llaman horas de interacción académica (HIA). Ambas suman a la columna HCD.</p>`],

 ["¿La asincronía significa dejar actividades para que el estudiante las resuelva solo?",`<p>No. Asincronía no es ausencia. Es un tiempo de acompañamiento en el que el profesor dinamiza la discusión, responde dudas en los plazos acordados, retroalimenta con sentido formativo e identifica a tiempo a quienes necesitan apoyo.</p>`],

const $ = s => document.querySelector(s);
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const strip = h => h.replace(/<[^>]+>/g," ");
let query = "";

function hlHTML(html){
  if(!query) return html;
  const q = norm(query);
  return html.split(/(<[^>]+>)/).map(part => {
    if(part.startsWith("<")) return part;
    const n = norm(part); let out="", i=0, p;
    while((p=n.indexOf(q,i))!==-1){ out += part.slice(i,p)+"<mark>"+part.slice(p,p+q.length)+"</mark>"; i=p+q.length; }
    return out + part.slice(i);
  }).join("");
}

function render(){
  const q = norm(query); let total = 0;
  const html = S.map((s,si) => {
    const items = s.q.map((it,qi)=>({it,qi})).filter(({it}) => !q || norm(it[0]+" "+strip(it[1])).includes(q));
    total += items.length;
    if(!items.length) return "";
    return `<section id="${s.id}" style="--c:var(${s.c})">
      <h2><span class="num">${si+1}</span>${s.t}<span class="qn">${items.length} ${items.length===1?"pregunta":"preguntas"}</span></h2>
      ${items.map(({it,qi}) => { const id=`${s.id}-${qi+1}`; return `
      <div class="item${q?" open":""}" id="${id}">
        <button class="q" aria-expanded="${!!q}" aria-controls="a-${id}"><span>${hlHTML(it[0])}</span><span class="icon" aria-hidden="true">+</span></button>
        <div class="a" id="a-${id}" role="region"><div><div class="inner">${hlHTML(it[1])}<button class="copy" data-id="${id}">Copiar enlace a esta pregunta</button></div></div></div>
      </div>`;}).join("")}
    </section>`;
  }).join("");
  $("#faq").innerHTML = html || `<div class="empty">No hay preguntas que mencionen “${query.replace(/</g,"&lt;")}”. <button id="clr">Ver todas las preguntas</button></div>`;
  const clr = $("#clr"); if(clr) clr.onclick = () => { $("#q").value=""; query=""; render(); };
  $("#status").textContent = q ? (total===1?"1 pregunta encontrada":`${total} preguntas encontradas`) : `${S.reduce((a,s)=>a+s.q.length,0)} preguntas en ${S.length} temas`;
  bind(); syncToggle();
}

function setOpen(item, open){
  item.classList.toggle("open", open);
  item.querySelector(".q").setAttribute("aria-expanded", open);
}
function bind(){
  document.querySelectorAll(".item").forEach(it => {
    it.querySelector(".q").onclick = () => { setOpen(it, !it.classList.contains("open")); syncToggle(); };
  });
  document.querySelectorAll(".copy").forEach(b => b.onclick = async () => {
    const url = location.href.split("#")[0] + "#" + b.dataset.id;
    try { await navigator.clipboard.writeText(url); b.textContent = "Enlace copiado"; }
    catch(e){ b.textContent = "No se pudo copiar; usa la barra de direcciones"; history.replaceState(null,"","#"+b.dataset.id); }
    setTimeout(()=> b.textContent = "Copiar enlace a esta pregunta", 2000);
  });
}
function syncToggle(){
  const all = [...document.querySelectorAll(".item")];
  const allOpen = all.length && all.every(i => i.classList.contains("open"));
  $("#toggleAll").textContent = allOpen ? "Cerrar todas" : "Abrir todas";
}
$("#toggleAll").onclick = () => {
  const all = [...document.querySelectorAll(".item")];
  const open = !all.every(i => i.classList.contains("open"));
  all.forEach(i => setOpen(i, open)); syncToggle();
};

$("#chips").innerHTML = S.map(s => `<button class="chip" data-id="${s.id}" style="--c:var(${s.c})">${s.t}</button>`).join("");
$("#chips").querySelectorAll(".chip").forEach(b => b.onclick = () => {
  const el = document.getElementById(b.dataset.id);
  if(el){ el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }
});
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => { if(e.isIntersecting){
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-current", c.dataset.id===e.target.id));
  }});
}, {rootMargin:"-30% 0px -60% 0px"});
function observe(){ document.querySelectorAll("section").forEach(s => obs.observe(s)); }

let t; $("#q").addEventListener("input", e => { clearTimeout(t); t = setTimeout(()=>{ query = e.target.value.trim(); render(); observe(); }, 120); });

render(); observe();
const h = location.hash.slice(1);
if(h){ const it = document.getElementById(h); if(it && it.classList.contains("item")){ setOpen(it,true); syncToggle(); setTimeout(()=>it.scrollIntoView(),50); } }
</script>
